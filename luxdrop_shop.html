<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuxDrop | ReStock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --white: #f5f5f5;
    --accent: #c8a96e;
    --gray: #1a1a1a;
    --gray2: #2a2a2a;
    --text-muted: #888;
    --original: #27ae60;
    --replica: #f39c12;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--black); color: var(--white); font-family: 'Inter', sans-serif; min-height: 100vh; }

  header { position: sticky; top: 0; z-index: 100; background: var(--black); border-bottom: 1px solid #222; padding: 12px 16px; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; color: var(--accent); }
  .cart-btn { position: relative; background: var(--gray2); border: none; color: var(--white); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; }
  .cart-count { position: absolute; top: -4px; right: -4px; background: var(--accent); color: var(--black); font-size: 10px; font-weight: 700; width: 17px; height: 17px; border-radius: 50%; display: none; align-items: center; justify-content: center; }

  .search-bar { display: flex; align-items: center; background: var(--gray2); border-radius: 10px; padding: 8px 12px; gap: 8px; margin-bottom: 10px; }
  .search-bar input { background: none; border: none; color: var(--white); font-size: 14px; font-family: 'Inter', sans-serif; width: 100%; outline: none; }
  .search-bar input::placeholder { color: var(--text-muted); }

  .filters-wrap { overflow-x: auto; scrollbar-width: none; }
  .filters-wrap::-webkit-scrollbar { display: none; }
  .filters { display: flex; gap: 6px; padding-bottom: 2px; }
  .filter-btn { background: var(--gray2); border: 1px solid #333; color: var(--text-muted); padding: 5px 12px; border-radius: 20px; font-size: 11px; font-family: 'Inter', sans-serif; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: var(--black); font-weight: 600; }
  .filter-btn.original-filter.active { background: var(--original); border-color: var(--original); color: white; }
  .filter-btn.replica-filter.active { background: var(--replica); border-color: var(--replica); color: white; }

  .filter-section { padding: 8px 16px; border-bottom: 1px solid #1a1a1a; }
  .filter-row { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-label { font-size: 10px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px 2px 100px; }

  .product-card { background: var(--gray); cursor: pointer; position: relative; overflow: hidden; }
  .product-img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: var(--gray2); }
  .product-img-placeholder { width: 100%; aspect-ratio: 3/4; background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%); display: flex; align-items: center; justify-content: center; font-size: 40px; }
  .product-info { padding: 8px 10px 10px; }
  .product-name { font-size: 11px; font-weight: 500; line-height: 1.4; margin-bottom: 4px; color: var(--white); }
  .product-brand { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
  .price-retail { font-size: 13px; font-weight: 600; color: var(--white); }
  .price-drop { font-size: 10px; color: var(--accent); font-weight: 500; }

  .badge { position: absolute; top: 8px; left: 8px; font-size: 9px; font-weight: 700; padding: 3px 7px; border-radius: 4px; letter-spacing: 0.5px; text-transform: uppercase; }
  .badge-original { background: var(--original); color: white; }
  .badge-replica { background: var(--replica); color: white; }

  .empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); }
  .empty-state-icon { font-size: 60px; margin-bottom: 16px; }
  .empty-state h3 { font-size: 18px; color: var(--white); margin-bottom: 8px; }

  .modal { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.85); align-items: flex-end; }
  .modal.open { display: flex; }
  .modal-content { background: var(--gray); width: 100%; border-radius: 20px 20px 0 0; max-height: 92vh; overflow-y: auto; animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 20px 20px 0 0; background: var(--gray2); display: flex; align-items: center; justify-content: center; font-size: 80px; }
  .modal-img img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 20px 20px 0 0; }
  .modal-body { padding: 16px 16px 30px; }
  .modal-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .modal-name { font-size: 17px; font-weight: 600; flex: 1; }
  .modal-badge { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 20px; margin-left: 10px; white-space: nowrap; }
  .modal-brand { font-size: 11px; color: var(--text-muted); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; }
  .modal-prices { display: flex; gap: 14px; margin-bottom: 14px; align-items: baseline; }
  .modal-price-retail { font-size: 20px; font-weight: 700; }
  .modal-price-drop { font-size: 13px; color: var(--accent); font-weight: 500; }
  .sizes-title { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .sizes { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .size-btn { background: var(--gray2); border: 1px solid #333; color: var(--white); padding: 7px 13px; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.2s; }
  .size-btn.selected { background: var(--accent); border-color: var(--accent); color: var(--black); font-weight: 600; }
  .order-btn { width: 100%; background: var(--accent); border: none; color: var(--black); padding: 15px; border-radius: 12px; font-size: 15px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; }
  .close-modal { position: absolute; top: 14px; right: 14px; background: rgba(0,0,0,0.5); border: none; color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; z-index: 10; }
  .modal-img-wrap { position: relative; }

  .cart-modal { display: none; position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.85); align-items: flex-end; }
  .cart-modal.open { display: flex; }
  .cart-content { background: var(--gray); width: 100%; border-radius: 20px 20px 0 0; max-height: 80vh; overflow-y: auto; padding: 20px 16px 30px; animation: slideUp 0.3s ease; }
  .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .cart-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; }
  .cart-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #222; align-items: center; }
  .cart-item-img { width: 46px; height: 46px; object-fit: cover; border-radius: 8px; background: var(--gray2); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .cart-item-info { flex: 1; }
  .cart-item-name { font-size: 12px; font-weight: 500; }
  .cart-item-size { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .cart-item-price { font-size: 13px; font-weight: 600; color: var(--accent); flex-shrink: 0; }
  .remove-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 4px; }
  .cart-total { display: flex; justify-content: space-between; padding: 14px 0; font-size: 15px; font-weight: 600; }
  .checkout-btn { width: 100%; background: var(--accent); border: none; color: var(--black); padding: 15px; border-radius: 12px; font-size: 15px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; }
  .empty-cart { text-align: center; padding: 40px 0; color: var(--text-muted); }

  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--black); padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.3s; z-index: 400; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo">LUXDROP | RESTOCK</div>
    <button class="cart-btn" onclick="openCart()">🛒<span class="cart-count" id="cartCount">0</span></button>
  </div>
  <div class="search-bar">
    <span style="color:#888">🔍</span>
    <input type="text" placeholder="Поиск по названию или бренду..." oninput="applyFilters()" id="searchInput" />
  </div>
  <div class="filters-wrap">
    <div class="filters" id="typeFilters">
      <button class="filter-btn active" onclick="setType('all', this)">Все</button>
      <button class="filter-btn original-filter" onclick="setType('original', this)">✅ Оригинал</button>
      <button class="filter-btn replica-filter" onclick="setType('replica', this)">🟡 Реплика</button>
    </div>
  </div>
</header>

<div class="filter-section">
  <div class="filter-label">Категория</div>
  <div class="filter-row" id="catFilters">
    <button class="filter-btn active" onclick="setCat('all', this)">Все</button>
  </div>
  <div class="filter-label" style="margin-top:8px">Бренд</div>
  <div class="filter-row" id="brandFilters">
    <button class="filter-btn active" onclick="setBrand('all', this)">Все</button>
  </div>
</div>

<div class="grid" id="productGrid"></div>

<div class="modal" id="productModal"><div class="modal-content" id="modalContent"></div></div>

<div class="cart-modal" id="cartModal">
  <div class="cart-content">
    <div class="cart-header">
      <div class="cart-title">КОРЗИНА</div>
      <button class="remove-btn" onclick="closeCart()" style="font-size:22px">✕</button>
    </div>
    <div id="cartItems"></div>
    <div id="cartFooter"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

let cart = [];
let activeType = 'all';
let activeCat = 'all';
let activeBrand = 'all';
let selectedSize = '';

function getBrands() {
  return [...new Set(products.map(p => p.brand))];
}

function getCats() {
  return [...new Set(products.map(p => p.category))];
}

function buildFilters() {
  const catEl = document.getElementById('catFilters');
  const brandEl = document.getElementById('brandFilters');

  getCats().forEach(cat => {
    if (!catEl.querySelector(`[data-cat="${cat}"]`)) {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.dataset.cat = cat;
      btn.textContent = cat;
      btn.onclick = () => setCat(cat, btn);
      catEl.appendChild(btn);
    }
  });

  getBrands().forEach(brand => {
    if (!brandEl.querySelector(`[data-brand="${brand}"]`)) {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.dataset.brand = brand;
      btn.textContent = brand;
      btn.onclick = () => setBrand(brand, btn);
      brandEl.appendChild(btn);
    }
  });
}

function setType(type, btn) {
  activeType = type;
  document.querySelectorAll('#typeFilters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function setCat(cat, btn) {
  activeCat = cat;
  document.querySelectorAll('#catFilters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function setBrand(brand, btn) {
  activeBrand = brand;
  document.querySelectorAll('#brandFilters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filtered = products.filter(p => {
    const matchType = activeType === 'all' || p.type === activeType;
    const matchCat = activeCat === 'all' || p.category === activeCat;
    const matchBrand = activeBrand === 'all' || p.brand === activeBrand;
    const matchSearch = p.name.toLowerCase().includes(search) || p.brand.toLowerCase().includes(search);
    return matchType && matchCat && matchBrand && matchSearch;
  });
  renderGrid(filtered);
}

function renderGrid(list) {
  const grid = document.getElementById('productGrid');
  if (list.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-state-icon">👕</div>
        <h3>Товары скоро появятся</h3>
        <p style="font-size:13px;margin-top:8px">Следи за обновлениями в канале</p>
      </div>`;
    return;
  }
  grid.innerHTML = list.map(p => `
    <div class="product-card" onclick="openProduct(${p.id})">
      <div class="badge badge-${p.type}">${p.type === 'original' ? '✅ Оригинал' : '🟡 Реплика'}</div>
      ${p.img
        ? `<img class="product-img" src="${p.img}" alt="${p.name}" loading="lazy" style="${!p.inStock ? 'filter:grayscale(0.7);opacity:0.6' : ''}" />`
        : `<div class="product-img-placeholder">👕</div>`}
      ${!p.inStock ? '<div style="position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;"><span style=\'background:#333;color:#aaa;font-size:11px;font-weight:700;padding:6px 14px;border-radius:20px;letter-spacing:1px\'>НЕТ В НАЛИЧИИ</span></div>' : ''}
      <div class="product-info">
        <div class="product-brand">${p.brand}</div>
        <div class="product-name">${p.name}</div>
        <div class="price-retail">${p.price} ₴</div>
        ${p.dropPrice ? `<div class="price-drop">Дроп: ${p.dropPrice} ₴</div>` : ''}
      </div>
    </div>
  `).join('');
}

function openProduct(id) {
  const p = products.find(x => x.id === id);
  selectedSize = '';
  document.getElementById('productModal').classList.add('open');
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-img-wrap">
      ${p.img
        ? `<img src="${p.img}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px 20px 0 0;" />`
        : `<div class="modal-img">👕</div>`}
      <button class="close-modal" onclick="closeProduct()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-top">
        <div class="modal-name">${p.name}</div>
        <span class="modal-badge badge-${p.type}" style="background:${p.type==='original'?'var(--original)':'var(--replica)'};color:white">
          ${p.type === 'original' ? '✅ Оригинал' : '🟡 Реплика'}
        </span>
      </div>
      <div class="modal-brand">${p.brand} · ${p.category}</div>
      <div class="modal-prices">
        <div class="modal-price-retail">${p.price} ₴</div>
        ${p.dropPrice ? `<div class="modal-price-drop">Дроп: ${p.dropPrice} ₴</div>` : ''}
      </div>
      ${!p.inStock ? '<div style="background:#222;color:#aaa;text-align:center;padding:10px;border-radius:10px;font-size:13px;margin-bottom:14px">⚠️ Нет в наличии — можно оставить предзаказ</div>' : ''}
      <div class="sizes-title">Размер</div>
      <div class="sizes">
        ${p.sizes.map(s => `<button class="size-btn" onclick="selectSize('${s}',this)">${s}</button>`).join('')}
      </div>
      <button class="order-btn" onclick="addToCart(${p.id})">В КОРЗИНУ</button>
    </div>
  `;
}

function selectSize(size, btn) {
  selectedSize = size;
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function closeProduct() {
  document.getElementById('productModal').classList.remove('open');
}

function addToCart(id) {
  if (!selectedSize) { showToast('Выбери размер!'); return; }
  const p = products.find(x => x.id === id);
  cart.push({...p, selectedSize, cartId: Date.now()});
  updateCartCount();
  closeProduct();
  showToast('Добавлено в корзину ✓');
}

function updateCartCount() {
  const el = document.getElementById('cartCount');
  el.textContent = cart.length;
  el.style.display = cart.length > 0 ? 'flex' : 'none';
}

function openCart() {
  const items = document.getElementById('cartItems');
  const footer = document.getElementById('cartFooter');
  if (cart.length === 0) {
    items.innerHTML = '<div class="empty-cart"><div style="font-size:48px;margin-bottom:12px">🛒</div><div>Корзина пуста</div></div>';
    footer.innerHTML = '';
  } else {
    const total = cart.reduce((s, i) => s + i.price, 0);
    items.innerHTML = cart.map(item => `
      <div class="cart-item">
        <div class="cart-item-img">${item.img ? `<img src="${item.img}" style="width:46px;height:46px;object-fit:cover;border-radius:8px">` : '👕'}</div>
        <div class="cart-item-info">
          <div class="cart-item-name">${item.name}</div>
          <div class="cart-item-size">${item.brand} · ${item.selectedSize}</div>
        </div>
        <div class="cart-item-price">${item.price} ₴</div>
        <button class="remove-btn" onclick="removeFromCart(${item.cartId})">✕</button>
      </div>
    `).join('');
    footer.innerHTML = `
      <div class="cart-total"><span>Итого:</span><span>${total} ₴</span></div>
      <button class="checkout-btn" onclick="checkout()">ОФОРМИТЬ ЗАКАЗ</button>
    `;
  }
  document.getElementById('cartModal').classList.add('open');
}

function removeFromCart(cartId) {
  cart = cart.filter(i => i.cartId !== cartId);
  updateCartCount();
  openCart();
}

function closeCart() {
  document.getElementById('cartModal').classList.remove('open');
}

function checkout() {
  const total = cart.reduce((s, i) => s + i.price, 0);
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.sendData(JSON.stringify({order: cart.map(i => ({name: i.name, size: i.selectedSize, price: i.price, brand: i.brand})), total}));
  } else {
    const items = cart.map(i => i.brand + ' ' + i.name + ' (' + i.selectedSize + ') - ' + i.price + '\u20B4').join('%0A');
    const msg = '\uD83D\uDED2 Новый заказ:%0A' + items + '%0A%0A\uD83D\uDCB0 Итого: ' + total + '\u20B4';
    window.open('https://t.me/' + encodeURIComponent('tattoo_on_your_body') + '?text=' + msg, '_blank');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

document.getElementById('productModal').addEventListener('click', function(e) { if (e.target===this) closeProduct(); });
document.getElementById('cartModal').addEventListener('click', function(e) { if (e.target===this) closeCart(); });

buildFilters();
applyFilters();
</script>
</body>
</html>
